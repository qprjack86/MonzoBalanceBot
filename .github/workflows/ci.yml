name: CI

on:
  push:
  pull_request:

jobs:
  test-discovery-guard:
    runs-on: ubuntu-latest
    env:
      MIN_TEST_COUNT: '20'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install all test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run full test discovery
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v | tee /tmp/unittest-discovery.log
      - name: Enforce minimum discovered tests
        run: |
          python - <<'PY'
          import os
          import re
          import sys

          minimum = int(os.environ.get("MIN_TEST_COUNT", "20"))
          content = open("/tmp/unittest-discovery.log", "r", encoding="utf-8").read()
          match = re.search(r"Ran\s+(\d+)\s+tests?", content)
          if not match:
              print("::error::Unable to determine discovered test count from unittest output.")
              sys.exit(1)

          discovered = int(match.group(1))
          print(f"Discovered tests: {discovered}; minimum required: {minimum}")
          if discovered < minimum:
              print(f"::error::Discovered test count dropped below threshold ({discovered} < {minimum}).")
              sys.exit(1)
          PY

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install core deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-core.txt
      - name: Run core checks
        run: |
          python -m py_compile core/settings.py core/monzo_client.py core/webhook_service.py stores/interfaces.py stores/memory_store.py stores/factory.py
          python -m unittest tests/test_webhook_service.py

  azure-adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install azure deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-azure.txt
      - name: Run azure adapter checks
        run: |
          python -m py_compile function_app.py stores/azure_table_store.py
          python -m unittest tests/adapters/test_azure_adapter.py

  fastapi-adapter-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fastapi deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-fastapi.txt
      - name: Run fastapi adapter checks
        run: |
          python -m py_compile app_fastapi.py
          python -m unittest tests/adapters/test_fastapi_adapter.py
