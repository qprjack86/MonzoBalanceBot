name: Deploy to Azure Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.13'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Zip for deployment
        run: zip -r deploy.zip . -x "venv/*" ".git/*" ".github/*" "*.pyc" "__pycache__/*" ".vscode/*" "tests/*" "get_token.py"

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Function App
        run: |
          az functionapp deployment source config-zip \
            --resource-group monzowatchdogjs2 \
            --name monzowatchdog-js \
            --src deploy.zip \
            --timeout 120

      - name: Verify deployment
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 10
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 https://monzowatchdog-js.azurewebsites.net/api/health)
            echo "Health check $i: $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Function app healthy"
              exit 0
            fi
          done
          echo "❌ Health check failed after deployment"
          exit 1
