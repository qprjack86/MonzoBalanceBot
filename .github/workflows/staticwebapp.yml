name: Deploy Static Web App

on:
  push:
    branches:
      - main
    paths:
      - staticwebapp/**
      - .github/workflows/staticwebapp.yml
  workflow_dispatch:

env:
  SWA_TOKEN_NAME: AZURE_STATIC_WEB_APPS_API_TOKEN

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets[env.SWA_TOKEN_NAME] }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: staticwebapp
          output_location: ''
